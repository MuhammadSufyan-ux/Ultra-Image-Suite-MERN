
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Py7 Image Tool - Powered by Muhammad Sufyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fdfdfd;
      }

      /* Global Stylish Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c5cae9;
        border-radius: 10px;
        transition: background 0.3s ease;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f51b5;
      }

      /* SIMPLE MODERN DROPDOWN - REMOVED CIRCLE & NOTCH */
      .simple-dropdown {
        position: absolute;
        top: 100%; 
        right: 0;
        width: 260px;
        background: #2b43b4; 
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        z-index: 200;
        margin-top: 4px;
        border: 1px solid rgba(255,255,255,0.1);
      }

      .dropdown-item-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.08);
        margin-bottom: 6px;
        border-radius: 8px;
        color: white;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
      }

      .dropdown-item-pill:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(4px);
      }

      .dropdown-icon-dot {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* FOOTER MIHRAB - Kept for branding unless requested otherwise, but simplified */
      .footer-notch-container {
        position: relative;
        background: #2b43b4;
        padding-top: 50px;
        margin-top: 60px;
      }

      .footer-mihrab-circle {
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 80px;
        background: white;
        border: 1px solid #c5cae9;
        border-radius: 50%;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }

      .footer-notch-mask {
        position: absolute;
        top: -1px;
        left: 50%;
        transform: translateX(-50%);
        width: 130px;
        height: 55px;
        background: #fdfdfd;
        border-radius: 0 0 65px 65px;
        z-index: 5;
      }

      .footer-notch-mask::before, .footer-notch-mask::after {
        content: '';
        position: absolute;
        top: 0;
        width: 25px;
        height: 25px;
        background: transparent;
      }

      .footer-notch-mask::before {
        left: -25px;
        border-radius: 0 25px 0 0;
        box-shadow: 10px -10px 0 0 #fdfdfd;
      }

      .footer-notch-mask::after {
        right: -25px;
        border-radius: 25px 0 0 0;
        box-shadow: -10px -10px 0 0 #fdfdfd;
      }

      @keyframes planeTakeOff {
        0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -30px) scale(1.1); opacity: 0.5; }
        100% { transform: translate(-50%, -120px) scale(1.3); opacity: 0; }
      }
      .plane-animate {
        animation: planeTakeOff 0.6s forwards;
      }

      @keyframes whatsapp-pulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      .wa-circle-btn { animation: whatsapp-pulse 2s infinite; }

      .py7-border-default { border: 1px solid #c5cae9 !important; }
    </style>
